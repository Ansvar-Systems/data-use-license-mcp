name: Publish npm

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build && npm run build:db

      - name: Test
        run: npm test

      - name: Publish (idempotent)
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@ansvar/data-use-license-mcp@${PKG_VERSION}" > /dev/null 2>&1; then
            echo "Version ${PKG_VERSION} already published; skipping."
            exit 0
          fi
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
