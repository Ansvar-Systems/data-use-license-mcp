name: Check Upstream Updates

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build database
        run: npm run build:db

      - name: Run drift detection
        run: npx tsx scripts/verify-hashes.ts --report-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
